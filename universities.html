<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universities</title>
    <link rel="stylesheet" href="./css/universities.css" />
    <script src="./js/universities.js"></script>
  </head>
  <body class="container">
    <div class="logo-text">
      <a href="./main.html">
        <img src="./images/logo-text.png" alt="" />
      </a>
    </div>
    <div>
      <a href="./menu.html">
        <img src="./images/home.png" alt="" class="home" />
      </a>
    </div>
    <div class="search-container">
      <label for="search"></label>
      <input
        type="search"
        class="search-input"
        id="searchInput"
        placeholder="Search"
      />
      <button class="search-button">
        <img class="s-b-img" src="./images/search.png" alt="" />
      </button>
    </div>
    <div class="university-container">
      <div class="content">
        <a
          class="content-link"
          href="https://en.wikipedia.org/wiki/Abai_Kazakh_National_Pedagogical_University"
        >
          <div class="content-img">
            <img class="university-img" src="./images/ABAI.png" alt="" />
          </div>
          <div class="content-name">
            <span class="content-name_heading"
              >Abai Kazakh National Pedagogical University</span
            >
            <span class="content-name_heading_s"
              >Almaty, Kazakhstan <br />1928</span
            >
          </div>
        </a>
      </div>
      <div class="content">
        <a
          class="content-link"
          href="https://en.wikipedia.org/wiki/Al-Farabi_Kazakh_National_University"
        >
          <div class="content-img">
            <img class="university-img" src="./images/Farabi.png" alt="" />
          </div>
          <div class="content-name">
            <span class="content-name_heading header"
              >Al-Farabi Kazakh National University</span
            >
            <span class="content-name_heading_s body"
              >Almaty, Kazakhstan <br />1934</span
            >
          </div>
        </a>
      </div>

      <div class="content">
        <a
          class="content-link"
          href="https://en.wikipedia.org/wiki/D._Serikbayev_East_Kazakhstan_Technical_University"
        >
          <div class="content-img">
            <img class="university-img" src="./images/EKSTU.png" alt="" />
          </div>
          <div class="content-name">
            <span class="content-name_heading"
              >EKSTU <br />D. Serikbayev East Kazakhstan technical
              university</span
            >
            <span class="content-name_heading_s"
              >Ust-Kamenogorsk, Kazakhstan <br />1958</span
            >
          </div>
        </a>
      </div>
    </div>
    <footer>
      <div class="bottom-text">
        <p class="motto">Your future is here</p>
        <p class="title_mini">VisionaryAcademics 2025</p>
      </div>

        <a href="#"
          ><img
            class="google-t"
            src="./images/google-translate.png"
            alt="google-translate"
            width="70px"
        /></a>
      </div> -->
    </footer>
  </body>
</html>
